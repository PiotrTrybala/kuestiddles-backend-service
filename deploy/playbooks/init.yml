---
- name: Init - Setup Node and Docker Swarm Environment
  hosts: swarm_manager
  gather_facts: true

  tasks:
    # - name: Load local .env variables
    #   ansible.builtin.include_vars:
    #     file: "{{ playbook_dir }}/../../.env"
    #     name: dotenv  
    - name: Ensure baseline OS dependencies are installed
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
        state: present
        update_cache: true

    - name: Ensure Docker Engine is installed
      ansible.builtin.apt:
        name: docker.io
        state: present

    - name: Ensure Docker Python SDK is installed for Ansible modules
      ansible.builtin.apt:
        name: python3-docker
        state: present

    - name: Initialize Docker Swarm Engine
      community.docker.docker_swarm:
        state: present

    - name: Create persistent host directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ compose_project_dir }}"
        - "{{ backup_dir }}"
        - /var/lib/caddy_data

    - name: Create secure external overlay network for web entrypoints
      community.docker.docker_network:
        name: "{{ docker_network }}"
        driver: overlay
        attachable: true
        state: present

    - name: Log into GitHub Container Registry
      community.docker.docker_login:
        registry_url: "{{ registry_url }}"
        username: "{{ registry_username }}"
        password: "{{ registry_password }}"

    - name: Deploy Caddy Automated HTTPS Edge Router Service
      community.docker.docker_swarm_service:
        name: caddy_router
        image: lucaslorentz/caddy-docker-proxy:2.8-alpine
        state: present
        networks:
          - name: "{{ docker_network }}"
        publish:
          - published_port: 80
            target_port: 80
          - published_port: 443
            target_port: 443
        placement:
          constraints:
            - node.role == manager
        mounts:
          - source: /var/run/docker.sock
            target: /var/run/docker.sock
            type: bind
          - source: /var/lib/caddy_data
            target: /data
            type: bind
        env:
          CADDY_INGRESS_NETWORKS: "{{ docker_network }}"

---
- name: Initialize Swarm Cluster and Infrastructure Network
  hosts: swarm_managers
  become: true
  tasks:
    - name: Check if Docker Swarm is already active
      docker_swarm:
        state: inspect
      register: swarm_status
      ignore_errors: true

    - name: Initialize Docker Swarm cluster
      docker_swarm:
        state: present
      when: swarm_status.failed

    - name: Create persistent storage for Caddy configuration
      file:
        path: "{{ caddy_config_dir }}"
        state: directory
        mode: '0755'

    - name: Create persistent storage for Caddy SSL/TLS certificates
      file:
        path: "{{ caddy_data_dir }}"
        state: directory
        mode: '0755'

    - name: Create shared overlay network for Caddy and application replicas
      docker_network:
        name: "{{ docker_network }}"
        driver: overlay
        attachable: true
        state: present
        opts:
          # This enables encrypted control plane communication across your swarm nodes
          encrypted: "true"