---
- name: Deploy - Rollout Application Stack to Swarm
  hosts: swarm_manager
  vars_files:
    - vars.yml

  tasks:
    - name: Load local .env variables
      ansible.builtin.include_vars:
        file: "{{ dotenv_path }}"
        name: dotenv

    - name: Check for an active service to create a backup checkpoint
      community.docker.docker_swarm_service_info:
        name: "{{ project_name }}"
      register: current_service_state

    - name: Save active service snapshot state
      ansible.builtin.copy:
        content: "{{ current_service_state.swarm_service | to_nice_json }}"
        dest: "{{ backup_dir }}/{{ project_name }}_previous.json"
        mode: '0600'
      when: current_service_state.exists

    - name: Deploy Backend Service Stack with Automatic HTTPS
      community.docker.docker_swarm_service:
        name: "{{ project_name }}"
        image: "{{ image_repository }}:{{ deploy_tag }}"
        state: present
        networks:
          - name: "{{ docker_network }}"
        replicas: "{{ app_replicas }}"
        
        # Zero-Downtime Rolling Update Settings
        update_config:
          parallelism: 1
          delay: 10s
          order: start-first
          failure_action: rollback

        # Labels interpreted by Caddy to auto-provision TLS
        labels:
          caddy: "{{ app_domain }}"
          caddy.reverse_proxy: "\{\{upstreams {{ app_port }}\}\}"
          caddy.tls.email: "{{ letsencrypt_email }}"

        # Continuous service health engine
        health_check:
          test: ["CMD-SHELL", "curl -f http://localhost:{{ app_port }}{{ healthcheck_path }} || exit 1"]
          interval: 10s
          timeout: 5s
          retries: 3
          start_period: 15s

        env:
          APP_NAME: "{{ app_name }}"
          APP_DOMAIN: "{{ app_domain }}"
          BETTER_AUTH_URL: "{{ better_auth_url }}"
          BETTER_AUTH_SECRET: "{{ better_auth_secret }}"
          AVATARS_URL: "{{ avatars_url }}"
          COMPETITION_TOKEN_SECRET: "{{ competition_token_secret }}"
          DATABASE_URL: "{{ database_url }}"
          REDIS_URL: "{{ redis_url }}"
          GOOGLE_CLIENT_ID: "{{ google_client_id }}"
          GOOGLE_CLIENT_SECRET: "{{ google_client_secret }}"
          GOOGLE_MOBILE_CLIENT_ID: "{{ google_mobile_client_id }}"
          MAILGUN_DOMAIN: "{{ mailgun_domain }}"
          MAILGUN_API_KEY: "{{ mailgun_api_key }}"
          AWS_REGION: "{{ aws_region }}"
          AWS_BUCKET_NAME: "{{ aws_bucket_name }}"
          AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
          AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
          STRIPE_SECRET_KEY: "{{ stripe_secret_key }}"
          STRIPE_REDIRECT_URI: "{{ stripe_webhook_secret }}"
          PLAN_STANDARD_PRICE_ID: "{{ plan_standard_price_id }}"
          STRIPE_SUCCESS_URL: "{{ stripe_success_url }}"
          STRIPE_CANCEL_URL: "{{ stripe_cancel_url }}"